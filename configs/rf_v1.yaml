# Random forest, first grid. Every combination below is one "setting".
# Changing anything here after a run has started is refused (see manifest.json);
# use a new run_name for a new grid.
run_name: rf_v1
model: rf
seed: 42
n_jobs: 10
select_by: macro_f1          # inner-loop metric that picks the setting, per outer fold
features:                    # arguments of FeaturePipeline
  n_probes: [5000, 10000, 20000]
  correct_material: [false, true]
model_params:                # arguments of RandomForestClassifier
  n_estimators: [500]
  max_features: [sqrt]
  class_weight: [balanced_subsample]
