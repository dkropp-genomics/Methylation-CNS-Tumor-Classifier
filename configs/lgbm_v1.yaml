# LightGBM tuned with Optuna: one study of n_trials per outer fold, each trial
# scored on that fold's 3 inner folds. Changing anything here after a run has
# started is refused (manifest.json); use a new run_name for a new search.
run_name: lgbm_v1
model: lgbm
seed: 42
n_jobs: 6                    # physical cores; LightGBM gains little from hyperthreads
select_by: macro_f1
n_trials: 20
fixed_params:
  class_weight: balanced     # as for the random forest: small classes count equally
  max_bin: 63                # coarser histograms: faster, and betas need no finer
  subsample_freq: 1          # apply `subsample` at every boosting round
  force_col_wise: true
  deterministic: true
  verbose: -1
search_space:
  # features (arguments of FeaturePipeline)
  n_probes:          {choice: [5000, 10000]}
  correct_material:  {choice: [false, true]}
  # model (arguments of LGBMClassifier)
  n_estimators:      {int: [100, 300]}            # boosting rounds; 91 trees per round
  learning_rate:     {float: [0.03, 0.2], log: true}
  num_leaves:        {int: [4, 31]}
  min_child_samples: {int: [2, 10]}               # some classes have 4 training samples
  colsample_bytree:  {float: [0.05, 0.5]}
  subsample:         {float: [0.6, 1.0]}
  reg_lambda:        {float: [0.001, 10.0], log: true}
